
spring.datasource.url=jdbc:postgresql://localhost:5432/college_leave_management
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keycloak JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/campusleave
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/campusleave/protocol/openid-connect/certs

# Keycloak Admin Client Configuration
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
keycloak.admin.realm=${KEYCLOAK_REALM:campusleave}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Initial Admin Provisioning
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:Application}
app.bootstrap-admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
